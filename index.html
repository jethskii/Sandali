<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sandali — Study Timer</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

<style>
  :root {
    --navy-deep: #070a1f;
    --navy: #10143a;
    --navy-light: #1b2158;
    --ink: #05060f;
    --paper: #fff3d6;
    --paper-dim: #d9c9a3;
    --neon-pink: #ff4fa3;
    --neon-orange: #ffa63e;
    --neon-yellow: #ffe066;
    --neon-cyan: #4de8ff;
    --neon-green: #6dff9e;
    --shadow-hard: #000000;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  body {
    font-family: 'VT323', monospace;
    color: var(--paper);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 14px;
    position: relative;
    overflow-x: hidden;
  }

  /* Full-viewport background layer */
  .bg-layer {
    position: fixed;
    inset: 0;
    z-index: -2;
    background: var(--navy-deep);
  }

  .bg-video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -2;
  }

  .bg-tint {
    position: fixed;
    inset: 0;
    z-index: -1;
    background: linear-gradient(180deg, rgba(7,10,31,0.35) 0%, rgba(7,10,31,0.65) 70%, rgba(7,10,31,0.85) 100%);
  }

  h1, h2, .pixel-font {
    font-family: 'Press Start 2P', monospace;
  }

  /* ---------- Card ---------- */
  .card {
    width: 100%;
    max-width: 480px;
    background: var(--navy);
    border: 4px solid var(--ink);
    box-shadow: 8px 8px 0 var(--shadow-hard), 0 0 24px rgba(255, 166, 62, 0.25);
    padding: 22px 20px 26px;
    position: relative;
  }

  .card::before {
    content: "";
    position: absolute;
    top: 6px; left: 6px; right: 6px; bottom: 6px;
    border: 2px dashed rgba(255, 224, 102, 0.25);
    pointer-events: none;
  }

  header.app-header {
    text-align: center;
    margin-bottom: 18px;
  }

  .signage {
    font-size: 15px;
    line-height: 1.7;
    color: var(--neon-pink);
    text-shadow:
      0 0 4px var(--neon-pink),
      0 0 10px var(--neon-pink),
      2px 2px 0 var(--ink);
    letter-spacing: 1px;
  }

  .tagline {
    font-size: 18px;
    color: var(--neon-cyan);
    text-shadow: 0 0 6px rgba(77, 232, 255, 0.6);
    margin-top: 6px;
  }

  .greeting {
    text-align: center;
    font-size: 20px;
    color: var(--neon-yellow);
    margin: 10px 0 4px;
    text-shadow: 1px 1px 0 var(--ink);
    min-height: 24px;
  }

  .mini-link {
    display: block;
    margin: 0 auto 16px;
    background: none;
    border: none;
    box-shadow: none;
    color: var(--neon-cyan);
    font-family: 'VT323', monospace;
    font-size: 15px;
    text-decoration: underline;
    padding: 2px 0;
    cursor: pointer;
    text-align: center;
  }

  .mini-link:active { transform: none; }

  /* ---------- Stats bar ---------- */
  .stats-bar {
    display: flex;
    gap: 8px;
    margin: 0 0 14px;
  }

  .stat {
    flex: 1;
    text-align: center;
    background: var(--navy-light);
    border: 2px solid var(--ink);
    box-shadow: 3px 3px 0 var(--shadow-hard);
    padding: 8px 4px;
  }

  .stat-num {
    display: block;
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    color: var(--neon-yellow);
  }

  .stat-label {
    display: block;
    font-size: 13px;
    color: var(--paper-dim);
    margin-top: 4px;
  }

  /* ---------- Goal bar ---------- */
  .goal-row {
    margin-bottom: 16px;
  }

  .goal-bar {
    height: 16px;
    background: var(--ink);
    border: 2px solid var(--ink);
    overflow: hidden;
  }

  .goal-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--neon-green), var(--neon-cyan));
    transition: width 0.3s ease;
  }

  .goal-text-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 15px;
    color: var(--paper-dim);
    margin-top: 4px;
  }

  .mini-btn {
    font-family: 'VT323', monospace;
    font-size: 14px;
    padding: 3px 9px;
    border: 2px solid var(--ink);
    box-shadow: 2px 2px 0 var(--shadow-hard);
    background: var(--neon-yellow);
    cursor: pointer;
    min-height: 28px;
  }

  .goal-edit {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }

  .goal-edit[hidden] { display: none; }

  .goal-edit input { flex: 1; margin-bottom: 0; }

  /* ---------- Form fields ---------- */
  .field {
    margin-bottom: 14px;
  }

  label {
    display: block;
    font-size: 16px;
    color: var(--paper-dim);
    margin-bottom: 6px;
    letter-spacing: 0.5px;
  }

  input[type="text"],
  input[type="number"],
  select {
    width: 100%;
    font-family: 'VT323', monospace;
    font-size: 20px;
    color: var(--ink);
    background: var(--paper);
    border: 3px solid var(--ink);
    box-shadow: 3px 3px 0 var(--shadow-hard);
    padding: 8px 10px;
    outline: none;
  }

  input[type="range"] {
    width: 100%;
    accent-color: var(--neon-pink);
  }

  .duration-row {
    display: flex;
    gap: 12px;
  }

  .duration-row[hidden] { display: none; }

  .duration-row .field {
    flex: 1;
    margin-bottom: 0;
  }

  input:focus-visible,
  button:focus-visible,
  select:focus-visible {
    outline: 3px dashed var(--neon-cyan);
    outline-offset: 3px;
  }

  /* ---------- Color tag picker ---------- */
  .color-row {
    display: flex;
    gap: 10px;
  }

  .color-swatch {
    width: 30px;
    height: 30px;
    border: 3px solid var(--ink);
    box-shadow: 2px 2px 0 var(--shadow-hard);
    cursor: pointer;
    padding: 0;
    min-height: 0;
  }

  .color-swatch.selected {
    outline: 3px solid var(--paper);
    outline-offset: 2px;
  }

  /* ---------- Pomodoro switch ---------- */
  .switch-label {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 18px;
    color: var(--paper-dim);
    cursor: pointer;
  }

  .switch-label input {
    width: 20px;
    height: 20px;
    accent-color: var(--neon-pink);
  }

  /* ---------- Timer capsule ---------- */
  .capsule-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 26px 0 20px;
  }

  .capsule {
    position: relative;
    z-index: 2;
    background: linear-gradient(180deg, #fffdf6 0%, var(--paper) 100%);
    border: 4px solid var(--ink);
    border-radius: 200px;
    box-shadow:
      6px 6px 0 var(--shadow-hard),
      0 0 22px rgba(255, 224, 102, 0.35);
    padding: 24px 44px 32px;
    text-align: center;
    min-width: 240px;
  }

  .capsule .subject-label {
    font-family: 'VT323', monospace;
    font-size: 17px;
    color: var(--navy-light);
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .capsule .digits {
    font-size: 46px;
    letter-spacing: 1px;
    color: var(--navy-light);
  }

  .capsule .digits .colon {
    font-size: 0.5em;
    color: var(--neon-pink);
    padding: 0 2px;
    vertical-align: middle;
  }

  .capsule.flash {
    animation: capsule-flash 0.35s steps(1) 6;
  }

  @keyframes capsule-flash {
    0%   { border-color: var(--ink); background: var(--paper); }
    50%  { border-color: var(--neon-pink); background: var(--neon-orange); }
    100% { border-color: var(--ink); background: var(--paper); }
  }

  .status-line {
    text-align: center;
    font-size: 17px;
    color: var(--neon-orange);
    min-height: 22px;
    margin-bottom: 6px;
  }

  /* ---------- Buttons ---------- */
  .controls {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    margin: -22px 0 8px;
    position: relative;
    z-index: 3;
  }

  button {
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    color: var(--ink);
    border: 3px solid var(--ink);
    box-shadow: 4px 4px 0 var(--shadow-hard);
    padding: 12px 14px;
    cursor: pointer;
    background: var(--neon-yellow);
    transition: transform 0.05s linear;
  }

  button:active:not(:disabled) {
    transform: translate(4px, 4px);
    box-shadow: 0 0 0 var(--shadow-hard);
  }

  button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  .pill-btn {
    border-radius: 999px;
    padding: 12px 20px;
    min-height: 44px;
  }

  #startBtn { background: var(--neon-green); }
  #pauseBtn { background: var(--neon-cyan); }
  #resetBtn { background: var(--neon-pink); color: var(--paper); }

  /* ---------- Session log / settings dropdowns ---------- */
  .log-section {
    margin-top: 22px;
    border-top: 3px solid var(--ink);
    padding-top: 14px;
  }

  .log-toggle {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--navy-light);
    font-size: 13px;
    color: var(--neon-yellow);
    text-shadow: 1px 1px 0 var(--ink);
    padding: 12px 14px;
    margin: 0;
    min-height: 44px;
  }

  .log-toggle .chevron {
    font-family: 'VT323', monospace;
    font-size: 20px;
    color: var(--neon-yellow);
    transition: transform 0.15s ease;
  }

  .log-toggle[aria-expanded="true"] .chevron {
    transform: rotate(180deg);
  }

  #sessionLog {
    list-style: none;
    margin: 10px 0 0;
    padding: 0;
    max-height: 220px;
    overflow-y: auto;
  }

  #sessionLog[hidden] {
    display: none;
  }

  #sessionLog li {
    background: var(--navy-light);
    border: 2px solid var(--ink);
    box-shadow: 3px 3px 0 var(--shadow-hard);
    padding: 8px 10px;
    margin-bottom: 8px;
    font-size: 17px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  #sessionLog li .log-subject {
    color: var(--neon-yellow);
    font-size: 18px;
    display: flex;
    align-items: center;
  }

  .log-chip {
    display: inline-block;
    width: 11px;
    height: 11px;
    margin-right: 7px;
    border: 1px solid var(--ink);
    flex-shrink: 0;
  }

  #sessionLog li .log-meta {
    color: var(--paper-dim);
    font-size: 15px;
  }

  .log-note-preview {
    font-size: 14px;
    font-style: italic;
    color: var(--neon-cyan);
    margin-top: 2px;
    word-break: break-word;
  }

  .note-toggle-btn {
    align-self: flex-start;
    margin-top: 6px;
  }

  .note-editor {
    margin-top: 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .note-editor[hidden] { display: none; }

  .note-textarea {
    width: 100%;
    font-family: 'VT323', monospace;
    font-size: 16px;
    color: var(--ink);
    background: var(--paper);
    border: 2px solid var(--ink);
    box-shadow: 2px 2px 0 var(--shadow-hard);
    padding: 6px 8px;
    resize: vertical;
    min-height: 50px;
  }

  .note-save-btn { align-self: flex-start; }

  @keyframes new-entry-pulse {
    0%   { box-shadow: 3px 3px 0 var(--shadow-hard), 0 0 0 rgba(255, 224, 102, 0); }
    30%  { box-shadow: 3px 3px 0 var(--shadow-hard), 0 0 16px rgba(255, 224, 102, 0.9); }
    100% { box-shadow: 3px 3px 0 var(--shadow-hard), 0 0 0 rgba(255, 224, 102, 0); }
  }

  #sessionLog li.new-entry {
    animation: new-entry-pulse 1.4s ease-out;
  }

  .empty-log {
    font-size: 16px;
    color: var(--paper-dim);
    text-align: center;
    padding: 6px 0;
  }

  .settings-panel {
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .settings-panel[hidden] { display: none; }

  /* ---------- Name modal ---------- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(5, 6, 15, 0.82);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 16px;
  }

  .modal-overlay[hidden] { display: none; }

  .modal {
    background: var(--navy);
    border: 4px solid var(--neon-yellow);
    box-shadow: 8px 8px 0 var(--shadow-hard);
    padding: 22px 20px;
    max-width: 380px;
    width: 100%;
    text-align: center;
  }

  .modal h2 {
    font-size: 14px;
    color: var(--neon-pink);
    text-shadow: 1px 1px 0 var(--ink);
    margin: 0 0 12px;
    line-height: 1.6;
  }

  .modal p {
    font-size: 18px;
    color: var(--paper-dim);
    margin: 0 0 14px;
  }

  .modal input[type="text"] {
    margin-bottom: 14px;
  }

  /* ---------- Fixed corner toggles ---------- */
  .corner-toggle {
    position: fixed;
    bottom: 16px;
    z-index: 40;
    font-size: 11px;
    padding: 10px 12px;
    background: var(--neon-yellow);
    min-height: 44px;
  }

  .corner-toggle.is-on { background: var(--neon-green); }

  #soundToggle { right: 16px; }
  #ambienceToggle { left: 16px; }

  /* ---------- Responsive ---------- */
  @media (max-width: 480px) {
    .capsule .digits { font-size: 34px; }
    .signage { font-size: 12px; }
    .tagline { font-size: 16px; }
    button { font-size: 10px; padding: 10px 10px; }
    .duration-row { flex-direction: row; }
    .stat-num { font-size: 12px; }
  }

  @media (max-width: 360px) {
    .capsule { padding: 18px 22px 26px; min-width: 0; width: 100%; }
    .capsule .digits { font-size: 28px; letter-spacing: 1px; }
    .controls { margin-top: -16px; }
  }
</style>
</head>
<body>

<div class="bg-layer" aria-hidden="true"></div>
<video
  id="bgVideo"
  class="bg-video"
  src="background.mp4"
  poster="Sandali.jpg"
  autoplay
  muted
  loop
  playsinline
  aria-hidden="true"
></video>
<div class="bg-tint" aria-hidden="true"></div>

<button type="button" id="soundToggle" class="corner-toggle" aria-pressed="false">🔈 SOUND OFF</button>
<button type="button" id="ambienceToggle" class="corner-toggle" aria-pressed="false">🎵 AMBIENCE OFF</button>

<main class="card">
  <header class="app-header">
    <h1 class="signage">✦ SANDALI ✦</h1>
    <p class="tagline">isang sandali, isang lesson.</p>
  </header>

  <p class="greeting" id="greeting" aria-live="polite"></p>
  <button type="button" id="editNameBtn" class="mini-link">✏️ not you? change name</button>

  <div class="stats-bar">
    <div class="stat">
      <span class="stat-num" id="streakNum">0</span>
      <span class="stat-label">🔥 day streak</span>
    </div>
    <div class="stat">
      <span class="stat-num" id="todayNum">0m</span>
      <span class="stat-label">today</span>
    </div>
    <div class="stat">
      <span class="stat-num" id="weekNum">0m</span>
      <span class="stat-label">this week</span>
    </div>
  </div>

  <div class="goal-row">
    <div class="goal-bar"><div class="goal-fill" id="goalFill"></div></div>
    <div class="goal-text-row">
      <span id="goalText">0 / 60 min goal</span>
      <button type="button" id="editGoalBtn" class="mini-btn" aria-label="Edit daily goal">✏️ EDIT</button>
    </div>
    <div class="goal-edit" id="goalEditRow" hidden>
      <input type="number" id="goalInput" min="5" max="1000" step="5" value="60">
      <button type="button" id="saveGoalBtn" class="mini-btn">SAVE</button>
    </div>
  </div>

  <section>
    <div class="field">
      <label for="subjectInput">Subject</label>
      <input type="text" id="subjectInput" placeholder="e.g. Calculus Review" maxlength="60" autocomplete="off">
    </div>

    <div class="field">
      <label>Color Tag</label>
      <div class="color-row" id="colorRow">
        <button type="button" class="color-swatch" data-color="pink" style="background:var(--neon-pink)" aria-label="Pink tag"></button>
        <button type="button" class="color-swatch" data-color="cyan" style="background:var(--neon-cyan)" aria-label="Cyan tag"></button>
        <button type="button" class="color-swatch" data-color="green" style="background:var(--neon-green)" aria-label="Green tag"></button>
        <button type="button" class="color-swatch" data-color="orange" style="background:var(--neon-orange)" aria-label="Orange tag"></button>
        <button type="button" class="color-swatch" data-color="yellow" style="background:var(--neon-yellow)" aria-label="Yellow tag"></button>
      </div>
    </div>

    <div class="field">
      <label class="switch-label">
        <input type="checkbox" id="pomodoroToggle">
        <span>🍅 Pomodoro Mode (auto focus/break cycles)</span>
      </label>
    </div>

    <div class="duration-row" id="manualDurationRow">
      <div class="field">
        <label for="minutesInput">Minutes</label>
        <input type="number" id="minutesInput" min="0" max="180" value="25" inputmode="numeric">
      </div>
      <div class="field">
        <label for="secondsInput">Seconds</label>
        <input type="number" id="secondsInput" min="0" max="59" value="0" inputmode="numeric">
      </div>
    </div>

    <div class="duration-row" id="pomodoroDurationRow" hidden>
      <div class="field">
        <label for="focusMinutesInput">Focus (min)</label>
        <input type="number" id="focusMinutesInput" min="1" max="120" value="25" inputmode="numeric">
      </div>
      <div class="field">
        <label for="breakMinutesInput">Break (min)</label>
        <input type="number" id="breakMinutesInput" min="1" max="60" value="5" inputmode="numeric">
      </div>
    </div>
  </section>

  <div class="capsule-wrap">
    <div class="capsule" id="capsule">
      <div class="subject-label" id="capsuleSubject">Ready when you are</div>
      <div class="digits" id="digits" aria-live="polite">25:00</div>
    </div>

    <div class="controls">
      <button type="button" id="startBtn" class="pill-btn">▶ START</button>
      <button type="button" id="pauseBtn" class="pill-btn" disabled>❚❚ PAUSE</button>
      <button type="button" id="resetBtn" class="pill-btn" disabled>⟲ RESET</button>
    </div>
  </div>

  <p class="status-line" id="statusLine">&nbsp;</p>

  <section class="log-section">
    <button type="button" class="log-toggle" id="settingsToggle" aria-expanded="false" aria-controls="settingsPanel">
      <span>⚙ ALARM SETTINGS</span>
      <span class="chevron" aria-hidden="true">▾</span>
    </button>
    <div id="settingsPanel" class="settings-panel" hidden>
      <div class="field">
        <label for="alarmToneSelect">Alarm Tone</label>
        <select id="alarmToneSelect">
          <option value="beep">Classic Beep</option>
          <option value="chime">Soft Chime</option>
          <option value="arcade">Arcade Blip</option>
        </select>
      </div>
      <div class="field">
        <label for="alarmVolumeInput">Alarm Volume</label>
        <input type="range" id="alarmVolumeInput" min="0" max="100" value="70">
      </div>
    </div>
  </section>

  <section class="log-section">
    <button type="button" class="log-toggle" id="logToggle" aria-expanded="false" aria-controls="sessionLog">
      <span>SESSION LOG</span>
      <span class="chevron" aria-hidden="true">▾</span>
    </button>
    <ul id="sessionLog" hidden></ul>
  </section>
</main>

<div class="modal-overlay" id="nameModal">
  <div class="modal">
    <h2>MAGANDANG GABI!</h2>
    <p>Before we start — what should Sandali call you?</p>
    <input type="text" id="nameInput" placeholder="Your name" maxlength="30" autocomplete="off">
    <button type="button" id="saveNameBtn">LET'S GO</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  var NAME_KEY = 'sandali_name';
  var LOG_KEY = 'sandali_sessions';
  var SOUND_KEY = 'sandali_sound_on';
  var GOAL_KEY = 'sandali_daily_goal_minutes';
  var ALARM_TONE_KEY = 'sandali_alarm_tone';
  var ALARM_VOL_KEY = 'sandali_alarm_volume';
  var ACTIVE_KEY = 'sandali_active_timer';
  var COLOR_KEY = 'sandali_last_color';

  var nameModal = document.getElementById('nameModal');
  var nameInput = document.getElementById('nameInput');
  var saveNameBtn = document.getElementById('saveNameBtn');
  var greetingEl = document.getElementById('greeting');
  var editNameBtn = document.getElementById('editNameBtn');

  var streakNum = document.getElementById('streakNum');
  var todayNum = document.getElementById('todayNum');
  var weekNum = document.getElementById('weekNum');

  var goalFill = document.getElementById('goalFill');
  var goalText = document.getElementById('goalText');
  var editGoalBtn = document.getElementById('editGoalBtn');
  var goalEditRow = document.getElementById('goalEditRow');
  var goalInput = document.getElementById('goalInput');
  var saveGoalBtn = document.getElementById('saveGoalBtn');

  var subjectInput = document.getElementById('subjectInput');
  var colorRow = document.getElementById('colorRow');
  var colorSwatches = colorRow.querySelectorAll('.color-swatch');

  var pomodoroToggle = document.getElementById('pomodoroToggle');
  var manualDurationRow = document.getElementById('manualDurationRow');
  var pomodoroDurationRow = document.getElementById('pomodoroDurationRow');
  var minutesInput = document.getElementById('minutesInput');
  var secondsInput = document.getElementById('secondsInput');

  function setSound(on) {

    }
    soundToggle.textContent = on ? '🔊 SOUND ON' : '🔈 SOUND OFF';

        document.removeEventListener('click', resumeSoundOnce);

  /* ---------- Ambient sound (generated, separate from alarm/video) ---------- */

  var ambienceToggle = document.getElementById('ambienceToggle');
  var ambienceNodes = null;
  var ambienceOn = false;

  function getAudioCtx() {
    if (!audioCtx) {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      audioCtx = new Ctx();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    return audioCtx;
  }

  function startAmbience() {
    if (ambienceNodes) return;
    var ctx = getAudioCtx();
    var bufferSize = 2 * ctx.sampleRate;
    var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    var data = buffer.getChannelData(0);
    var lastOut = 0;
    for (var i = 0; i < bufferSize; i++) {
      var white = Math.random() * 2 - 1;
      data[i] = (lastOut + 0.02 * white) / 1.02;
      lastOut = data[i];
      data[i] *= 3.5;
    }
    var source = ctx.createBufferSource();
    source.buffer = buffer;
    source.loop = true;
    var filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 700;
    var gain = ctx.createGain();
    gain.gain.value = 0.0001;
    gain.gain.linearRampToValueAtTime(0.12, ctx.currentTime + 1.2);
    source.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);
    source.start();
    ambienceNodes = { source: source, gain: gain };
  }

  function stopAmbience() {
    if (!ambienceNodes) return;
    var ctx = getAudioCtx();
    var g = ambienceNodes.gain;
    var s = ambienceNodes.source;
    g.gain.linearRampToValueAtTime(0.0001, ctx.currentTime + 0.4);
    setTimeout(function () { try { s.stop(); } catch (e) {} }, 500);
    ambienceNodes = null;
  }

  function setAmbience(on) {
    ambienceOn = on;
    if (on) { startAmbience(); } else { stopAmbience(); }
    ambienceToggle.textContent = on ? '🎵 AMBIENCE ON' : '🎵 AMBIENCE OFF';
    ambienceToggle.classList.toggle('is-on', on);
    ambienceToggle.setAttribute('aria-pressed', on ? 'true' : 'false');
  }

  ambienceToggle.addEventListener('click', function () {
    setAmbience(!ambienceOn);
  });

  /* ---------- Pomodoro mode toggle ---------- */

  function clampInt(val, min, max, fallback) {
    var n = parseInt(val, 10);
    if (isNaN(n)) return fallback;
    return Math.max(min, Math.min(max, n));
  }

  function currentInputSeconds() {
    if (pomodoroToggle.checked) {
      return clampInt(focusMinutesInput.value, 1, 120, 25) * 60;
    }
    return readInputSeconds();
  }

  pomodoroToggle.addEventListener('change', function () {
    var checked = pomodoroToggle.checked;
    manualDurationRow.hidden = checked;
    pomodoroDurationRow.hidden = !checked;
    if (!isRunning && !isPaused) {
      remainingSeconds = currentInputSeconds();
      activeTotalSeconds = remainingSeconds;
      updateDigits();
    }
  });

  focusMinutesInput.addEventListener('input', function () {

  /* ---------- Timer helpers ---------- */

  function formatTime(totalSecs) {
    var m = Math.floor(totalSecs / 60);
    var s = totalSecs % 60;
    return (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
  }

  function readInputSeconds() {
    var mins = parseInt(minutesInput.value, 10);
    var secs = parseInt(secondsInput.value, 10);
    if (isNaN(mins) || mins < 0) mins = 0;
    if (isNaN(secs) || secs < 0) secs = 0;
    if (secs > 59) secs = 59;
    return mins * 60 + secs;
  }

  function updateDigits() {
    var parts = formatTime(remainingSeconds).split(':');
    digitsEl.innerHTML = parts[0] + '<span class="colon">:</span>' + parts[1];
  }

  function setControlsState() {
    startBtn.disabled = isRunning;
    subjectInput.disabled = isRunning;
    minutesInput.disabled = isRunning;
    secondsInput.disabled = isRunning;
    focusMinutesInput.disabled = isRunning;
    breakMinutesInput.disabled = isRunning;
    pomodoroToggle.disabled = isRunning || isPaused;
    pauseBtn.disabled = !isRunning && !isPaused;
    resetBtn.disabled = !isRunning && !isPaused;
    pauseBtn.textContent = isPaused ? '▶ RESUME' : '❚❚ PAUSE';
  }

  /* ---------- Audio alarm ---------- */

  function beep(freq, startOffset, duration, peak) {
    var ctx = getAudioCtx();
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = (alarmTone === 'chime') ? 'sine' : 'square';
    osc.frequency.value = freq;
    var vol = (peak !== undefined ? peak : 0.35) * (alarmVolume / 100);
    var startTime = ctx.currentTime + startOffset;
    gain.gain.setValueAtTime(0.0001, startTime);
    gain.gain.exponentialRampToValueAtTime(Math.max(vol, 0.0002), startTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(startTime);
    osc.stop(startTime + duration + 0.02);
  }

  function playAlarm() {
    try {
      if (alarmTone === 'chime') {
        beep(523, 0.00, 0.35);
        beep(659, 0.15, 0.35);
        beep(784, 0.30, 0.5);
      } else if (alarmTone === 'arcade') {
        beep(660, 0.00, 0.08);
        beep(880, 0.10, 0.08);
        beep(660, 0.20, 0.08);
        beep(880, 0.30, 0.16);
      } else {
        beep(880, 0.00, 0.18);
        beep(880, 0.25, 0.18);
        beep(1046, 0.50, 0.30);
      }
    } catch (e) {
      /* Web Audio unavailable — visual flash still signals completion */
    }
  }

  alarmToneSelect.value = alarmTone;
  alarmVolumeInput.value = String(alarmVolume);

  alarmToneSelect.addEventListener('change', function () {
    alarmTone = alarmToneSelect.value;
    localStorage.setItem(ALARM_TONE_KEY, alarmTone);
  });

  alarmVolumeInput.addEventListener('input', function () {
    alarmVolume = parseInt(alarmVolumeInput.value, 10);
    localStorage.setItem(ALARM_VOL_KEY, String(alarmVolume));
  });

  settingsToggle.addEventListener('click', function () {
    var willOpen = settingsPanel.hidden;
    settingsPanel.hidden = !willOpen;
    settingsToggle.setAttribute('aria-expanded', willOpen ? 'true' : 'false');

  function flashCapsule() {
    capsule.classList.remove('flash');
    void capsule.offsetWidth;
    capsule.classList.add('flash');
    setTimeout(function () { capsule.classList.remove('flash'); }, 2200);
  }

  /* ---------- Stats: streaks, today/week totals, goal ---------- */

  function pad2(n) { return n < 10 ? '0' + n : '' + n; }

  function isoOfDate(d) {
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }

  function todayISO() { return isoOfDate(new Date()); }

  function formatMinutesShort(totalSeconds) {
    var mins = Math.round(totalSeconds / 60);
    if (mins < 60) return mins + 'm';
    var h = Math.floor(mins / 60);
    var m = mins % 60;
    return h + 'h' + (m ? ' ' + m + 'm' : '');
  }

  function computeStats(sessions) {
    var todayStr = todayISO();
    var now = Date.now();
    var weekMs = 7 * 24 * 60 * 60 * 1000;
    var todayTotal = 0;
    var weekTotal = 0;
    var dateSet = {};
    sessions.forEach(function (s) {
      dateSet[s.dateISO] = true;
      if (s.dateISO === todayStr) todayTotal += s.durationSeconds;
      if (now - s.timestamp <= weekMs) weekTotal += s.durationSeconds;
    });
    var streak = 0;
    var cursor = new Date();
    if (!dateSet[isoOfDate(cursor)]) { cursor.setDate(cursor.getDate() - 1); }
    while (dateSet[isoOfDate(cursor)]) {
      streak++;
      cursor.setDate(cursor.getDate() - 1);
    }
    return { todayTotal: todayTotal, weekTotal: weekTotal, streak: streak };
  }

  function getGoalMinutes() {
    var v = parseInt(localStorage.getItem(GOAL_KEY), 10);
    return (isNaN(v) || v <= 0) ? 60 : v;
  }

  function renderGoal(todayTotalSeconds) {
    var goalMin = getGoalMinutes();
    var todayMin = Math.round(todayTotalSeconds / 60);
    var pct = Math.min(100, Math.round((todayMin / goalMin) * 100));
    goalFill.style.width = pct + '%';
    goalText.textContent = todayMin + ' / ' + goalMin + ' min goal';
  }

  function renderStats() {
    var sessions = loadSessions();
    var stats = computeStats(sessions);
    streakNum.textContent = stats.streak;
    todayNum.textContent = formatMinutesShort(stats.todayTotal);
    weekNum.textContent = formatMinutesShort(stats.weekTotal);
    renderGoal(stats.todayTotal);
    return stats;
  }

  editGoalBtn.addEventListener('click', function () {
    goalInput.value = getGoalMinutes();
    goalEditRow.hidden = false;
    goalInput.focus();
  });

  saveGoalBtn.addEventListener('click', function () {
    var val = clampInt(goalInput.value, 5, 1000, 60);
    localStorage.setItem(GOAL_KEY, String(val));
    goalEditRow.hidden = true;
    renderStats();
  });

  /* ---------- Session log ---------- */

  function loadSessions() {
    try {
      var raw = localStorage.getItem(LOG_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function saveSessions(list) {
    localStorage.setItem(LOG_KEY, JSON.stringify(list));
  }

  function renderSessions(highlightFirst) {
    var sessions = loadSessions();
    sessionLogEl.innerHTML = '';
    if (sessions.length === 0) {
      var empty = document.createElement('li');
      empty.className = 'empty-log';
      empty.textContent = 'No sessions yet — your finished study sprints will show up here.';
      sessionLogEl.appendChild(empty);
      return;
    }
    sessions.forEach(function (s, index) {
      var li = document.createElement('li');
      li.setAttribute('data-id', s.id || '');
      if (highlightFirst && index === 0) li.className = 'new-entry';

      var subj = document.createElement('div');
      subj.className = 'log-subject';
      var chip = document.createElement('span');
      chip.className = 'log-chip';
      chip.style.background = 'var(--neon-' + (s.colorTag || 'pink') + ')';
      subj.appendChild(chip);
      subj.appendChild(document.createTextNode(s.subject));

      var meta = document.createElement('div');
      meta.className = 'log-meta';
      meta.textContent = formatTime(s.durationSeconds) + ' · completed ' + s.completedAt;

      li.appendChild(subj);
      li.appendChild(meta);

      if (s.note) {
        var preview = document.createElement('div');
        preview.className = 'log-note-preview';
        preview.textContent = '📝 ' + s.note;
        li.appendChild(preview);
      }

      if (s.id) {
        var noteToggleBtn = document.createElement('button');
        noteToggleBtn.type = 'button';
        noteToggleBtn.className = 'mini-btn note-toggle-btn';
        noteToggleBtn.textContent = s.note ? '✏️ EDIT NOTE' : '📝 ADD NOTE';
        li.appendChild(noteToggleBtn);

        var editor = document.createElement('div');
        editor.className = 'note-editor';
        editor.hidden = true;
        var textarea = document.createElement('textarea');
        textarea.className = 'note-textarea';
        textarea.maxLength = 300;
        textarea.rows = 2;
        textarea.value = s.note || '';
        textarea.placeholder = 'What did you cover? Anything to remember next time?';
        var saveNoteBtn = document.createElement('button');
        saveNoteBtn.type = 'button';
        saveNoteBtn.className = 'mini-btn note-save-btn';
        saveNoteBtn.textContent = 'SAVE NOTE';
        editor.appendChild(textarea);
        editor.appendChild(saveNoteBtn);
        li.appendChild(editor);
      }

      sessionLogEl.appendChild(li);
    });
  }

  sessionLogEl.addEventListener('click', function (e) {
    var toggleBtn = e.target.closest('.note-toggle-btn');
    if (toggleBtn) {
      var li = toggleBtn.closest('li');
      var editor = li.querySelector('.note-editor');
      editor.hidden = !editor.hidden;
      if (!editor.hidden) {
        var ta = editor.querySelector('.note-textarea');
        ta.focus();
      }
      return;
    }
    var saveBtn = e.target.closest('.note-save-btn');
    if (saveBtn) {
      var saveLi = saveBtn.closest('li');
      var id = saveLi.getAttribute('data-id');
      var textareaEl = saveLi.querySelector('.note-textarea');
      saveNoteForSession(id, textareaEl.value);
    }
  });

  function makeSessionId() {
    return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
  }

  function logSession(subject, durationSeconds, colorTag) {
    var sessions = loadSessions();
    var now = new Date();
    sessions.unshift({
      id: makeSessionId(),
      subject: subject,
      durationSeconds: durationSeconds,
      colorTag: colorTag || 'pink',
      dateISO: todayISO(),
      timestamp: now.getTime(),
      completedAt: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
      note: ''
    });
    saveSessions(sessions);
    renderSessions(true);
    return renderStats();
  }

  function saveNoteForSession(id, text) {
    var sessions = loadSessions();
    var target = null;
    for (var i = 0; i < sessions.length; i++) {
      if (sessions[i].id === id) { target = sessions[i]; break; }
    }
    if (!target) return;
    target.note = text.trim();
    saveSessions(sessions);
    renderSessions();
  }

  logToggle.addEventListener('click', function () {
    var willOpen = sessionLogEl.hidden;
    sessionLogEl.hidden = !willOpen;
    logToggle.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
  });

  /* ---------- Persist / resume active timer ---------- */

  function persistActive() {
    if (!isRunning && !isPaused) {
      localStorage.removeItem(ACTIVE_KEY);
      return;
    }
    var data = {
      subject: activeSubject,
      colorTag: activeColorTag,
      totalSeconds: activeTotalSeconds,
      remainingSeconds: remainingSeconds,
      isPaused: isPaused,
      savedAt: Date.now(),
      pomodoro: pomodoroEnabledForRun ? {
        enabled: true,
        phase: currentPhase,
        focusMin: pomoFocusMinutes,
        breakMin: pomoBreakMinutes,
        cycles: cyclesCompleted
      } : null
    };
    localStorage.setItem(ACTIVE_KEY, JSON.stringify(data));
  }

  function clearActive() {
    localStorage.removeItem(ACTIVE_KEY);
  }

  function restoreActive() {
    var raw = localStorage.getItem(ACTIVE_KEY);
    if (!raw) return;
    var data;
    try { data = JSON.parse(raw); } catch (e) { return; }
    if (!data) return;

    var elapsedSec = data.isPaused ? 0 : Math.floor((Date.now() - data.savedAt) / 1000);
    var newRemaining = data.remainingSeconds - elapsedSec;

    activeSubject = data.subject;
    activeColorTag = data.colorTag || 'pink';
    activeTotalSeconds = data.totalSeconds;
    subjectInput.value = activeSubject;
    selectColor(activeColorTag);

    if (data.pomodoro && data.pomodoro.enabled) {
      pomodoroEnabledForRun = true;
      currentPhase = data.pomodoro.phase;
      pomoFocusMinutes = data.pomodoro.focusMin;
      pomoBreakMinutes = data.pomodoro.breakMin;
      cyclesCompleted = data.pomodoro.cycles;
      pomodoroToggle.checked = true;
      manualDurationRow.hidden = true;
      pomodoroDurationRow.hidden = false;
      capsuleSubject.textContent = (currentPhase === 'break') ? '☕ Break Time' : activeSubject;
    } else {
      capsuleSubject.textContent = activeSubject;
    }

    if (newRemaining <= 0) {
      clearActive();
      if (pomodoroEnabledForRun && currentPhase === 'break') {
        statusLine.textContent = 'Your break finished while you were away.';
      } else if (pomodoroEnabledForRun && currentPhase === 'focus') {
        logSession(activeSubject, pomoFocusMinutes * 60, activeColorTag);
        statusLine.textContent = 'Your last focus block finished while you were away — logged it.';
      } else {
        logSession(activeSubject, activeTotalSeconds, activeColorTag);
        statusLine.textContent = 'Your last session finished while you were away — logged it.';
      }
      resetTimer();
      return;
    }

    remainingSeconds = newRemaining;
    isPaused = data.isPaused;
    isRunning = !data.isPaused;
    updateDigits();
    setControlsState();
    if (isRunning) {
      timerHandle = setInterval(tick, 1000);
      statusLine.textContent = (currentPhase === 'break' ? 'On break (resumed)' : 'Studying: ' + activeSubject + ' (resumed)');
    } else {
      statusLine.textContent = (currentPhase === 'break' ? 'Paused: break' : 'Paused: ' + activeSubject);
    }
  }

  /* ---------- Auto-pause when the tab is hidden ---------- */

  document.addEventListener('visibilitychange', function () {
    if (document.hidden && isRunning) {
      pauseOrResume();
      statusLine.textContent = "⏸ Auto-paused — you switched tabs! Tap Resume when you're back.";
    }
  });

  /* ---------- Timer control ---------- */

  function tick() {
    remainingSeconds--;
    updateDigits();
    if (remainingSeconds <= 0) {
      completeTimer();
    }
  }

  function completeTimer() {
    clearInterval(timerHandle);
    timerHandle = null;
    isRunning = false;
    isPaused = false;
    remainingSeconds = 0;
    updateDigits();
    flashCapsule();
    playAlarm();

    if (pomodoroEnabledForRun && currentPhase === 'focus') {
      var stats1 = logSession(activeSubject, pomoFocusMinutes * 60, activeColorTag);
      cyclesCompleted++;
      currentPhase = 'break';
      activeTotalSeconds = pomoBreakMinutes * 60;
      remainingSeconds = activeTotalSeconds;
      capsuleSubject.textContent = '☕ Break Time';
      updateDigits();
      statusLine.textContent = '🎉 Focus done! ' + stats1.streak + ' day streak. Break for ' + formatTime(activeTotalSeconds) + '.';
      isRunning = true;
      timerHandle = setInterval(tick, 1000);
      setControlsState();
      persistActive();
    } else if (pomodoroEnabledForRun && currentPhase === 'break') {
      currentPhase = 'focus';
      activeTotalSeconds = pomoFocusMinutes * 60;
      remainingSeconds = activeTotalSeconds;
      capsuleSubject.textContent = activeSubject;
      updateDigits();
      statusLine.textContent = '🍅 Break over! Back to focus — round ' + (cyclesCompleted + 1) + '.';
      isRunning = true;
      timerHandle = setInterval(tick, 1000);
      setControlsState();
      persistActive();
    } else {
      var stats2 = logSession(activeSubject, activeTotalSeconds, activeColorTag);
      statusLine.textContent = '🎉 ' + activeSubject + ' — ' + formatTime(activeTotalSeconds) + ' logged! ' + stats2.streak + ' day streak.';
      clearActive();
      setControlsState();
    }
  }

  function startTimer() {
    if (isRunning) return;

    if (isPaused) {
      isRunning = true;
      isPaused = false;
      statusLine.textContent = (currentPhase === 'break' ? 'On break' : 'Studying: ' + activeSubject);
      timerHandle = setInterval(tick, 1000);
      setControlsState();
      persistActive();
      return;
    }

    pomodoroEnabledForRun = pomodoroToggle.checked;
    activeColorTag = selectedColor;

    if (pomodoroEnabledForRun) {
      pomoFocusMinutes = clampInt(focusMinutesInput.value, 1, 120, 25);
      pomoBreakMinutes = clampInt(breakMinutesInput.value, 1, 60, 5);
      currentPhase = 'focus';
      cyclesCompleted = 0;
      activeSubject = subjectInput.value.trim() || 'Study Session';
      activeTotalSeconds = pomoFocusMinutes * 60;
      remainingSeconds = activeTotalSeconds;
      capsuleSubject.textContent = activeSubject;
    } else {
      var totalSecs = readInputSeconds();
      if (totalSecs <= 0) {
        statusLine.textContent = 'Set a duration greater than 0 first.';
        return;
      }
      activeSubject = subjectInput.value.trim() || 'Study Session';
      activeTotalSeconds = totalSecs;
      remainingSeconds = totalSecs;
      capsuleSubject.textContent = activeSubject;
    }

    updateDigits();
    isRunning = true;
    isPaused = false;
    statusLine.textContent = (pomodoroEnabledForRun ? '🍅 Focus: ' : 'Studying: ') + activeSubject;
    timerHandle = setInterval(tick, 1000);
    setControlsState();
    persistActive();
  }

  function pauseOrResume() {
    if (!isRunning && !isPaused) return;
    if (isRunning) {
      clearInterval(timerHandle);
      timerHandle = null;
      isRunning = false;
      isPaused = true;
      statusLine.textContent = (currentPhase === 'break' ? 'Paused: break' : 'Paused: ' + activeSubject);
      setControlsState();
      persistActive();
    } else {
      startTimer();
    }
  }

  function resetTimer() {
    clearInterval(timerHandle);
    timerHandle = null;
    isRunning = false;
    isPaused = false;
    pomodoroEnabledForRun = false;
    currentPhase = 'focus';
    cyclesCompleted = 0;
    activeSubject = '';
    activeTotalSeconds = 0;
    capsuleSubject.textContent = 'Ready when you are';
    statusLine.textContent = '';
    capsule.classList.remove('flash');
    clearActive();
    remainingSeconds = currentInputSeconds();
    activeTotalSeconds = remainingSeconds;
    updateDigits();
    setControlsState();
  }

  startBtn.addEventListener('click', startTimer);
  pauseBtn.addEventListener('click', pauseOrResume);
  resetBtn.addEventListener('click', resetTimer);

  minutesInput.addEventListener('input', function () {
    if (!isRunning && !isPaused) {
      remainingSeconds = readInputSeconds();
      activeTotalSeconds = remainingSeconds;
      updateDigits();
    }
  });
  secondsInput.addEventListener('input', function () {
    if (!isRunning && !isPaused) {
      remainingSeconds = readInputSeconds();
      activeTotalSeconds = remainingSeconds;
      updateDigits();
    }
  });

  /* ---------- Init ---------- */

  initName();
  remainingSeconds = readInputSeconds();
  activeTotalSeconds = remainingSeconds;
  updateDigits();
  renderSessions();
  renderStats();
  setControlsState();
  restoreActive();
})();
</script>

</body>
</html>
